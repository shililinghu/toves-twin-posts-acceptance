<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="game-preview-mode" content="fixed-phone-v1"><title>Tove’s Twin Posts · 试玩</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20242c}
body{display:grid;place-items:center}#phone-shell{position:relative;overflow:hidden;border-radius:12px;outline:1px solid #515762;box-shadow:0 12px 48px #0008;background:#fff}
#phone-game{position:absolute;left:0;top:0;border:0;display:block;transform-origin:top left;background:#fff}</style>
</head><body><main id="phone-shell" aria-label="手机尺寸游戏试玩"><iframe id="phone-game" title="游戏试玩" allow="autoplay; gamepad; fullscreen 'none'"></iframe></main>
<script>(()=>{const width=390,height=844,shell=document.getElementById('phone-shell'),frame=document.getElementById('phone-game');
frame.style.width=width+'px';frame.style.height=height+'px';
const game=new URL('game-graph-20261031/index.html',location.href);game.search=location.search;game.searchParams.set('__phone_game','1');window.__gameURL=game.pathname+game.search+location.hash;
function fit(){const scale=Math.min(1,Math.max(1,innerWidth-32)/width,Math.max(1,innerHeight-32)/height);shell.style.width=width*scale+'px';shell.style.height=height*scale+'px';frame.style.transform='scale('+scale+')';window.__phonePreview={policy:'fixed-phone-v1',width,height,scale};}
addEventListener('resize',fit);fit();})();</script>
<div id="startup" style="position:fixed;inset:0;display:grid;place-content:center;gap:22px;text-align:center;background:#171717;color:white;font:16px Arial;z-index:10"><div style="font-size:38px">COCOS</div><progress id="download" max="1" value="0" style="width:240px;accent-color:#aed8c8"></progress><div id="startup-status">Loading…</div><button id="startup-retry" hidden onclick="location.reload()" style="padding:14px;border:0;border-radius:8px;background:#aed8c8">Retry</button></div>
<script>(async()=>{const status=document.getElementById('startup-status');try{if(!('serviceWorker'in navigator))throw Error('Please use Chrome or Safari.');await navigator.serviceWorker.register('startup-worker.js');await navigator.serviceWorker.ready;if(!navigator.serviceWorker.controller)await new Promise(r=>navigator.serviceWorker.addEventListener('controllerchange',r,{once:true}));await new Promise((resolve,reject)=>{const channel=new MessageChannel();channel.port1.onmessage=e=>{if(e.data.error)reject(Error(e.data.error));else if(e.data.done)resolve();else{document.getElementById('download').value=e.data.loaded/e.data.total;status.textContent='Loading '+Math.round(e.data.loaded/e.data.total*100)+'%';}};navigator.serviceWorker.controller.postMessage({prepare:true},[channel.port2]);});const f=document.getElementById('phone-game');f.onload=()=>document.getElementById('startup').remove();f.src=window.__gameURL;}catch(e){status.textContent=e.message;document.getElementById('startup-retry').hidden=false;}})();</script></body></html>
